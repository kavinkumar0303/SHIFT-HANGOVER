<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIFT//HANDOVER — Operator Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
    }

    .login-glow-circle {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 97, 251, 0.35) 0%, rgba(13, 19, 56, 0) 70%);
      filter: blur(28px);
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 2;
    }

    .login-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .login-heading {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .login-subtext {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.45;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-form-group input {
      background: var(--bg-input);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #FFFFFF;
      font-size: 14px;
      font-family: var(--font-sans);
      transition: all var(--transition-fast);
    }

    .login-form-group input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-login-submit {
      margin-top: 6px;
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-pill);
      background: var(--accent-primary);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all var(--transition-fast);
    }

    .btn-login-submit:hover {
      background: var(--accent-bright);
      box-shadow: 0 6px 22px var(--accent-glow);
      transform: translateY(-1px);
    }

    .preset-accounts-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 24px 0 10px 0;
      text-align: center;
    }

    .preset-accounts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .preset-account-btn {
      background: rgba(13, 19, 56, 0.7);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
    }

    .preset-account-btn:hover {
      background: rgba(56, 97, 251, 0.15);
      border-color: var(--accent-primary);
      color: #FFFFFF;
    }

    .auth-badges-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .auth-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      color: var(--accent-bright);
      background: rgba(56, 97, 251, 0.1);
      border: 1px solid var(--border-accent);
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }

    .error-box {
      background: rgba(255, 75, 110, 0.12);
      border: 1px solid rgba(255, 75, 110, 0.4);
      color: var(--color-blockers);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-glow-circle"></div>

    <div class="login-card">
      <div class="login-brand-row">
        <svg class="brand-gear-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="brand-title">SHIFT<span class="brand-accent">//</span>MACHINE</span>
      </div>

      <h1 class="login-heading">Operator Access</h1>
      <p class="login-subtext">Sign in to authenticate telemetry processing and manage handover notes.</p>

      <div id="login-error" class="error-box hidden"></div>

      <form id="login-form" class="login-form">
        <div class="login-form-group">
          <label for="email">Workstation Email</label>
          <input type="email" id="email" name="email" value="operator@noc.internal" required autofocus>
        </div>

        <div class="login-form-group">
          <label for="password">Session Password</label>
          <input type="password" id="password" name="password" value="demo" required>
        </div>

        <button type="submit" class="btn-login-submit" id="btn-submit-login">AUTHENTICATE & ENTER</button>
      </form>

      <div class="preset-accounts-title">Select Demo Account:</div>
      <div class="preset-accounts-grid">
        <button type="button" class="preset-account-btn" data-email="operator@noc.internal" data-pass="demo">
          On-Call SRE
        </button>
        <button type="button" class="preset-account-btn" data-email="supervisor@noc.internal" data-pass="demo">
          Supervisor
        </button>
        <button type="button" class="preset-account-btn" data-email="admin@shifthandover.io" data-pass="demo">
          NOC Admin
        </button>
      </div>

      <div class="auth-badges-row">
        <span class="auth-badge">PROTOTYPE AUTH</span>
        <span class="auth-badge">HASHED CREDENTIALS</span>
        <span class="auth-badge">INTEGRATION READY</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("login-form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const errorBox = document.getElementById("login-error");
      const submitBtn = document.getElementById("btn-submit-login");

      document.querySelectorAll(".preset-account-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          emailInput.value = btn.getAttribute("data-email") || "";
          passwordInput.value = btn.getAttribute("data-pass") || "demo";
          errorBox.classList.add("hidden");
        });
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("hidden");
        submitBtn.disabled = true;
        submitBtn.textContent = "VERIFYING CREDENTIALS...";

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: emailInput.value.trim(),
              password: passwordInput.value
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || "Authentication failed. Check your password.");
          }

          if (data.token) {
            localStorage.setItem("shift_token", data.token);
          }
          if (data.user) {
            localStorage.setItem("shift_user", JSON.stringify(data.user));
          }

          window.location.href = "/";
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.remove("hidden");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "AUTHENTICATE & ENTER";
        }
      });
    });
  </script>
</body>
</html>
